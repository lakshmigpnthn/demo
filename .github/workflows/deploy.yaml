# Kubernetes Deployment Pipeline
# Validates and deploys Kubernetes manifests to EKS clusters
#
# Triggers:
#   - Push to main: Full validate → deploy backend → deploy gateway → smoke test
#   - Pull requests: Validate only (dry-run)
#   - Manual dispatch: Optional selective deployment

name: Deploy Applications

on:
  push:
    branches:
      - main
    paths:
      - 'kubernetes/**'
      - '.github/workflows/deploy.yaml'
  pull_request:
    branches:
      - main
    paths:
      - 'kubernetes/**'
      - '.github/workflows/deploy.yaml'
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: 'Deploy backend service'
        required: false
        default: true
        type: boolean
      deploy_gateway:
        description: 'Deploy gateway proxy'
        required: false
        default: true
        type: boolean

# Ensure only one deployment runs at a time
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: 'us-west-2'
  GATEWAY_CLUSTER: 'eks-gateway'
  BACKEND_CLUSTER: 'eks-backend'

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  #----------------------------------------------------------------------------
  # Validate Kubernetes Manifests
  #----------------------------------------------------------------------------
  validate:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.29.0'

      - name: Dry-run Backend Manifests
        if: github.event_name == 'pull_request'
        run: |
          echo "🔍 Dry-run validation for backend manifests..."
          kubectl apply --dry-run=client -f kubernetes/backend/

      - name: Dry-run Gateway Manifests
        if: github.event_name == 'pull_request'
        run: |
          echo "🔍 Dry-run validation for gateway manifests..."
          kubectl apply --dry-run=client -f kubernetes/gateway/

  #----------------------------------------------------------------------------
  # Deploy Backend Service
  #----------------------------------------------------------------------------
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: validate
    if: |
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_backend == 'true')
    environment: eks-backend
    outputs:
      backend_pod_ip: ${{ steps.get-ip.outputs.pod_ip }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Use static credentials (OIDC requires admin to create provider)
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.29.0'

      - name: Configure kubectl for Backend Cluster
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.BACKEND_CLUSTER }} \
            --region ${{ env.AWS_REGION }}

      - name: Deploy Backend Namespace
        run: kubectl apply -f kubernetes/backend/namespace.yaml

      - name: Deploy Backend ConfigMap and Deployment
        run: kubectl apply -f kubernetes/backend/deployment.yaml

      - name: Deploy Backend Service
        run: kubectl apply -f kubernetes/backend/service.yaml

      - name: Deploy Backend NetworkPolicy
        run: kubectl apply -f kubernetes/backend/network-policy.yaml

      - name: Wait for Backend Rollout
        run: |
          kubectl rollout status deployment/backend -n backend --timeout=300s

      - name: Get Backend Pod IP
        id: get-ip
        run: |
          # Wait for pod to have an IP
          for i in {1..30}; do
            POD_IP=$(kubectl get pods -n backend -l app=backend -o jsonpath='{.items[0].status.podIP}' 2>/dev/null)
            if [ -n "$POD_IP" ]; then
              echo "Backend Pod IP: $POD_IP"
              echo "pod_ip=$POD_IP" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "Waiting for pod IP... ($i/30)"
            sleep 5
          done
          echo "Failed to get pod IP"
          exit 1

      - name: Verify Backend Health
        run: |
          POD_NAME=$(kubectl get pods -n backend -l app=backend -o jsonpath='{.items[0].metadata.name}')
          echo "Testing health endpoint on pod: $POD_NAME"
          kubectl exec -n backend $POD_NAME -- wget -q -O- http://localhost:8080/health || \
            kubectl exec -n backend $POD_NAME -- curl -s http://localhost:8080/health

  #----------------------------------------------------------------------------
  # Deploy Gateway Proxy
  #----------------------------------------------------------------------------
  deploy-gateway:
    name: Deploy Gateway
    runs-on: ubuntu-latest
    needs: deploy-backend
    if: |
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_gateway == 'true')
    environment: eks-gateway
    outputs:
      gateway_url: ${{ steps.get-url.outputs.url }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.29.0'

      - name: Configure kubectl for Gateway Cluster
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.GATEWAY_CLUSTER }} \
            --region ${{ env.AWS_REGION }}

      - name: Update Gateway Config with Backend IP
        run: |
          BACKEND_IP="${{ needs.deploy-backend.outputs.backend_pod_ip }}"
          echo "📝 Updating gateway config with backend IP: $BACKEND_IP"
          
          # Update configmap.yaml
          sed -i "s/BACKEND_POD_IP_PLACEHOLDER/$BACKEND_IP/g" kubernetes/gateway/configmap.yaml
          
          # Update deployment.yaml (backend-endpoint configmap)
          sed -i "s/BACKEND_POD_IP_PLACEHOLDER/$BACKEND_IP/g" kubernetes/gateway/deployment.yaml
          
          echo "Gateway configuration updated"

      - name: Deploy Gateway Namespace
        run: kubectl apply -f kubernetes/gateway/namespace.yaml

      - name: Deploy Gateway ConfigMaps
        run: |
          kubectl apply -f kubernetes/gateway/configmap.yaml
          kubectl apply -f kubernetes/gateway/deployment.yaml

      - name: Deploy Gateway Service
        run: kubectl apply -f kubernetes/gateway/service.yaml

      - name: Deploy Gateway NetworkPolicy
        run: kubectl apply -f kubernetes/gateway/network-policy.yaml

      - name: Wait for Gateway Rollout
        run: |
          kubectl rollout status deployment/nginx-proxy -n gateway --timeout=300s

      - name: Wait for LoadBalancer
        id: get-url
        run: |
          echo "⏳ Waiting for LoadBalancer to be provisioned..."
          for i in {1..60}; do
            LB_HOSTNAME=$(kubectl get svc nginx-proxy -n gateway -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null)
            if [ -n "$LB_HOSTNAME" ]; then
              echo "Gateway URL: http://$LB_HOSTNAME"
              echo "url=http://$LB_HOSTNAME" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "Waiting for LoadBalancer... ($i/60)"
            sleep 10
          done
          echo "LoadBalancer not provisioned in time"
          exit 1

  #----------------------------------------------------------------------------
  # Smoke Tests
  #----------------------------------------------------------------------------
  smoke-test:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy-gateway
    if: |
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch')
    
    steps:
      - name: Wait for DNS Propagation
        run: |
          echo "⏳ Waiting 60s for DNS propagation..."
          sleep 60

      - name: Test Gateway Health
        run: |
          GATEWAY_URL="${{ needs.deploy-gateway.outputs.gateway_url }}"
          echo "Testing gateway health: $GATEWAY_URL/health"
          
          for i in {1..10}; do
            RESPONSE=$(curl -s -w "\n%{http_code}" "$GATEWAY_URL/health" 2>/dev/null || true)
            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | head -n-1)
            
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Gateway health check passed"
              echo "Response: $BODY"
              break
            fi
            
            echo "Attempt $i/10 - HTTP $HTTP_CODE, retrying..."
            sleep 10
          done
          
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Gateway health check failed"
            exit 1
          fi

      - name: Test Backend via Gateway (VPC Peering Validation)
        run: |
          GATEWAY_URL="${{ needs.deploy-gateway.outputs.gateway_url }}"
          echo "Testing backend via gateway: $GATEWAY_URL/api"
          
          for i in {1..10}; do
            RESPONSE=$(curl -s -w "\n%{http_code}" "$GATEWAY_URL/api" 2>/dev/null || true)
            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | head -n-1)
            
            if [ "$HTTP_CODE" = "200" ]; then
              # Verify response is from backend
              if echo "$BODY" | grep -q "backend"; then
                echo "Backend connectivity verified via VPC peering!"
                echo "Response: $BODY"
                exit 0
              fi
            fi
            
            echo "Attempt $i/10 - HTTP $HTTP_CODE, retrying..."
            sleep 10
          done
          
          echo "Backend connectivity test failed"
          exit 1

      - name: Generate Test Summary
        run: |
          echo "## Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Gateway URL" >> $GITHUB_STEP_SUMMARY
          echo "\`${{ needs.deploy-gateway.outputs.gateway_url }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Results" >> $GITHUB_STEP_SUMMARY
          echo "- Gateway health check: Passed" >> $GITHUB_STEP_SUMMARY
          echo "- Backend via VPC peering: Passed" >> $GITHUB_STEP_SUMMARY
